<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archipelago</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<canvas id="map" tabindex="0" aria-label="Map"></canvas>
<div id="map-focus" class="map-focus"></div>
<aside id="outline" class="outline" tabindex="0" role="listbox" aria-label="Outline"></aside>

<header class="chrome top">
  <div class="chrome-stack">
    <div class="title-row">
      <nav id="breadcrumb" class="breadcrumb" aria-label="Scale"></nav>
      <div id="mode" class="mode"></div>
    </div>
    <div id="strip" class="strip"></div>
    <div id="status" class="status"></div>
  </div>
</header>

<aside id="pane" class="pane" tabindex="0" hidden></aside>
<div id="cta" class="cta" hidden></div>
<div id="board-scrim" class="board-scrim" hidden></div>
<section id="board" class="board" tabindex="0" aria-label="Board" hidden></section>
<button id="board-toggle" class="board-toggle" type="button" hidden></button>
<div id="about" class="about" role="dialog" aria-label="About you" hidden></div>
<div id="new-domain" class="new-domain" role="dialog" aria-label="New domain" hidden></div>
<div id="hosted" class="hosted" role="dialog" aria-label="Archipelago" hidden></div>
<div id="keys" class="keys" hidden></div>

<script src="/vendor/mermaid.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
